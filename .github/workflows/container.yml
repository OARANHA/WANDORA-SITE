name: Container image

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - prisma/**
      - public/**
      - src/**
      - package.json
      - package-lock.json
      - compose.yaml
      - .github/workflows/container.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - prisma/**
      - public/**
      - src/**
      - package.json
      - package-lock.json
      - compose.yaml
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wandora-site-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose
        run: docker compose -f compose.yaml config --quiet

  image:
    name: Build site image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/oaranha/wandora-site:sha-${{ github.sha }}
            ghcr.io/oaranha/wandora-site:main
          labels: |
            org.opencontainers.image.source=https://github.com/OARANHA/WANDORA-SITE
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Wandora Site
          cache-from: type=gha,scope=wandora-site
          cache-to: type=gha,mode=max,scope=wandora-site
